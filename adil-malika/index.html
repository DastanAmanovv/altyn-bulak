<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чакыруу</title>
<meta property="og:title" content="Адиль жана Малика — Чакыруу">
<meta name="description" content="Адиль жана Малика, сиздерге «Алтын Булак» эс алуу жайынын ачылышына чакыруу">
<meta property="og:description" content="Адиль жана Малика, сиздерге «Алтын Булак» эс алуу жайынын ачылышына чакыруу">
<meta property="og:image" content="https://dastanamanovv.github.io/altyn-bulak/assets/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2a2420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="../inv/adil-malika.jpg">
<style>
  :root{
    --bg1:#3a322b; --bg2:#1d1916;
    --paper:#f1ece2; --paper-2:#e9e2d5; --paper-in:#d9cfbf;
    --gold-1:#e6c77a; --gold-2:#b08a3e; --gold-3:#8a6a2b;
    --ink:#f3e9d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:radial-gradient(120% 90% at 50% 35%, var(--bg1) 0%, var(--bg2) 100%);
    color:var(--ink); font-family:Montserrat,system-ui,sans-serif;
    overflow:hidden; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0}

  .stage{position:fixed;inset:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:1;padding:16px}

  /* ---------- Envelope ---------- */
  .env{
    --w:min(84vw, 400px, calc((100vh - 150px) * .75));
    --w:min(84vw, 400px, calc((100dvh - 150px) * .75));
    width:var(--w); aspect-ratio:3/4; position:relative;
    perspective:1600px; cursor:pointer;
    transition:transform 1s cubic-bezier(.6,0,.3,1), opacity .8s ease;
    animation:float 5s ease-in-out infinite;
  }
  .env.opened{animation:none}
  @keyframes float{50%{transform:translateY(-8px)}}

  .back{position:absolute;inset:0;border-radius:6px;
    background:linear-gradient(180deg,var(--paper-in),var(--paper-2));
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6),0 10px 20px rgba(0,0,0,.25)}

  .card{position:absolute;left:6%;right:6%;top:5%;height:90%;z-index:2;
    border-radius:3px;overflow:hidden;background:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
  .card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}

  .pocket{position:absolute;inset:0;z-index:3;pointer-events:none;
    filter:drop-shadow(0 -2px 3px rgba(0,0,0,.10))}
  .pocket .p{position:absolute;inset:0;border-radius:0 0 6px 6px;
    background:
      radial-gradient(140% 90% at 50% 120%, rgba(0,0,0,.05), transparent 60%),
      linear-gradient(180deg,var(--paper),var(--paper-2));
    clip-path:polygon(0 38%,50% 62%,100% 38%,100% 100%,0 100%)}
  .pocket svg{position:absolute;inset:0;width:100%;height:100%}

  .flap{position:absolute;left:0;right:0;top:0;height:54%;z-index:4;
    transform-origin:50% 0; transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.5,0,.25,1)}
  .flap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    clip-path:polygon(0 0,100% 0,50% 100%)}
  .flap .front{background:
      linear-gradient(180deg,#f6f2ea 0%,var(--paper) 55%,#e8e1d4 100%);
    border-radius:6px 6px 0 0}
  .flap .inside{transform:rotateX(180deg);background:linear-gradient(0deg,#e4dccd,#d6ccba)}
  .flap .edge{position:absolute;inset:0;width:100%;height:100%}

  .title{position:absolute;left:0;right:0;top:30%;text-align:center;
    font-weight:300;font-size:calc(var(--w) * .115);letter-spacing:.02em;
    background:linear-gradient(100deg,var(--gold-3) 0%,var(--gold-1) 35%,var(--gold-2) 55%,var(--gold-1) 75%,var(--gold-3) 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 6s linear infinite}
  @keyframes shine{to{background-position:-200% 0}}

  .seal{position:absolute;z-index:5;left:50%;top:54%;width:34%;aspect-ratio:1;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));
    transition:transform .6s cubic-bezier(.5,-0.4,.5,1), opacity .5s ease .1s}
  .seal img{width:100%;height:100%;display:block}
  .env:not(.opened):hover .seal{transform:translate(-50%,-50%) scale(1.04)}
  .seal::after{content:"";position:absolute;inset:-6%;border-radius:50%;
    border:1px solid rgba(230,199,122,.55);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.35);opacity:0}}

  /* ---------- Opening sequence ---------- */
  .env.s1 .seal{transform:translate(-50%,-30%) scale(1.25) rotate(-12deg);opacity:0}
  .env.s1 .seal::after{display:none}
  .card{opacity:0}
  .back{background:linear-gradient(180deg,#f3eee5,var(--paper-2));transition:background .6s}
  .env.s2 .card{opacity:1}
  .env.s2 .back{background:linear-gradient(180deg,var(--paper-in),var(--paper-2))}
  .env.s2 .flap{transform:rotateX(180deg)}
  .env.s3 .flap{z-index:1}
  .env.s4{transform:translateY(16%)}
  .env.s4 .card{transform:translateY(-52%)}
  .env.s5{transform:translateY(60vh) scale(.9);opacity:0}

  .names{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:var(--gold-1);text-align:center;transition:opacity .4s;min-height:1em}
  .hint{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:20px;
    color:rgba(243,233,214,.75);letter-spacing:.03em;transition:opacity .4s;
    animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.4}}
  .hide{animation:none!important;opacity:0!important;visibility:hidden;pointer-events:none;transition:opacity .4s,visibility 0s .4s}
  .stage.gone{visibility:hidden}

  /* ---------- Final view ---------- */
  .view{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    gap:14px;opacity:0;-webkit-user-select:auto;user-select:auto;pointer-events:none;transition:opacity .9s ease;overflow:auto}
  .view.on{opacity:1;pointer-events:auto}
  .view img{max-width:min(100%,720px);max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);-webkit-touch-callout:default;object-fit:contain;border-radius:4px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.7);
    transform:translateY(30px) scale(.94);transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
  .view.on img{transform:none}
  .actions{display:flex;gap:10px}
  .btn{font:400 13px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold-1);text-decoration:none;border:1px solid rgba(230,199,122,.45);
    padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.15);cursor:pointer}
  .btn:hover{background:rgba(230,199,122,.12)}

  @media (prefers-reduced-motion:reduce){
    .env,.seal::after,.hint,.title{animation:none}
  }
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="stage" id="stage">
  <div class="names" id="names">Адиль жана Малика</div>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Ачуу үчүн басыңыз">
    <div class="back"></div>
    <div class="card"><img src="../inv/adil-malika.jpg" alt=""></div>
    <div class="pocket">
      <div class="p"></div>
      <svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 400 L150 248 L300 400" fill="none" stroke="rgba(120,100,70,.18)" stroke-width="1"/>
      </svg>
    </div>
    <div class="flap">
      <div class="face front">
        <svg class="edge" viewBox="0 0 300 216" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 0 L150 216 L300 0" fill="none" stroke="rgba(110,90,60,.25)" stroke-width="1.2"/>
        </svg>
        <div class="title">Чакыруу</div>
      </div>
      <div class="face inside"></div>
    </div>
    <div class="seal"><img src="../assets/seal.png" alt=""></div>
  </div>
  <div class="hint" id="hint">Ачуу үчүн басыңыз</div>
</div>

<div class="view" id="view">
  <img src="../inv/adil-malika.jpg" alt="Чакыруу">
  <div class="actions">
    <a class="btn" href="../inv/adil-malika.jpg" download>Сактоо</a>
  </div>
</div>

<script>
(() => {
  const env = document.getElementById('env'), hint = document.getElementById('hint'), view = document.getElementById('view');
  const steps = [['s1',0],['s2',450],['s3',900],['s4',1300],['s5',2600]];
  let opened = false;
  function open(){
    if (opened) return; opened = true;
    env.classList.add('opened'); hint.classList.add('hide'); document.getElementById('names').classList.add('hide');
    steps.forEach(([c,t]) => setTimeout(() => env.classList.add(c), t));
    setTimeout(() => view.classList.add('on'), 2700);
    setTimeout(() => document.getElementById('stage').classList.add('gone'), 3700);
    if (navigator.vibrate) navigator.vibrate(15);
  }
  env.addEventListener('click', open);
  env.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); open(); } });

  // snow
  const cv = document.getElementById('snow'), ctx = cv.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let W, H, flakes = [];
  const dpr = Math.min(devicePixelRatio || 1, 2);
  function resize(){
    W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = W+'px'; cv.style.height = H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(120, W*H/9000));
    flakes = Array.from({length:n}, () => mk(true));
  }
  function mk(any){ return {x:Math.random()*W, y:any?Math.random()*H:-10, r:Math.random()*2.2+.6,
    s:Math.random()*.6+.25, d:Math.random()*Math.PI*2, a:Math.random()*.5+.35}; }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for (const f of flakes){
      f.d += .01; f.y += f.s; f.x += Math.sin(f.d)*.35;
      if (f.y > H+5){ Object.assign(f, mk(false)); }
      ctx.globalAlpha = f.a; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fillStyle='#fff'; ctx.fill();
    }
    if (!document.hidden) requestAnimationFrame(tick);
  }
  addEventListener('resize', resize); resize(); tick();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
